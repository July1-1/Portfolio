services:
  redis:
    image: redis:7.2.4-alpine  
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      
  frontend:
    image: mx-queretaro-1.ocir.io/axbkferrc7jy/koalapexv1:1.0
    ports:
      - "8080:8080"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:  # Existing Redis volume
  ollama-models:  # New named volume for Ollama